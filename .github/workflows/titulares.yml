name: Actualizar titulares
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  titulares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/titulares.py
      - run: |
          git config user.name "titulares-bot"
          git config user.email "actions@users.noreply.github.com"
          git add titulares.json
          git diff --cached --quiet || (git commit -m "Titulares actualizados" && git push)
